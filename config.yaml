# Jarvis configuration. Behaviour lives here; secrets live in .env.

model:
  id: claude-opus-5
  # low | medium | high | xhigh | max. A voice turn is judged on latency, so
  # `low` keeps time-to-first-word down. Note this lowers effort rather than
  # setting thinking to disabled: with thinking off, Opus 5 will occasionally
  # narrate a tool call as plain text instead of emitting a tool_use block,
  # which in a spoken loop just sounds like Jarvis lying about what it did.
  effort: low
  # A hard ceiling the model cannot see, not a length target. Reply length is
  # steered by the system prompt instead - a spoken answer cut off mid-sentence
  # is worse than one that rambles.
  max_tokens: 4096

audio:
  sample_rate: 16000    # whisper's native rate, and what we ask ElevenLabs to return
  frame_ms: 20
  # null = system default. Worth pinning by name: on a Mac the default
  # follows whatever Bluetooth device is connected, so a car handsfree can
  # quietly become your microphone. `python run.py devices` lists them.
  input_device: "MacBook Pro Microphone"
  # Pinned for the same reason as the input: the system default follows
  # whatever Bluetooth device is connected, so Jarvis ends up talking into
  # a car while you wait for it in front of the laptop.
  output_device: "MacBook Pro Speakers"

vad:
  # Speech is detected by comparing frame RMS against a noise floor measured
  # during the first moment of each listen. Ratios, not absolute levels, so the
  # same numbers work in a quiet room and a loud one.
  start_ratio: 2.0
  stop_ratio: 1.5         # lower than start_ratio: once talking, stay latched
  absolute_floor: 0.0069   # never trigger below this, however quiet the room is
  min_speech_ms: 250      # discard clicks, keyboard taps, door slams
  silence_hangover_ms: 800  # how long a mid-sentence pause may run before the turn ends
  preroll_ms: 300         # audio kept from *before* the trigger, so the first
                          # syllable is not clipped off the front
  calibration_ms: 400
  max_utterance_s: 30

stt:
  model: small.en       # tiny.en | base.en | small.en | medium.en | large-v3
  # ctranslate2 has no Metal backend, so "cpu" is not a fallback on Apple
  # silicon - it is the only path, and int8 is the fast one.
  device: cpu
  compute_type: int8
  language: en
  beam_size: 1          # greedy; measurably faster and barely worse on clean speech

tts:
  # "River". A premade voice, which free accounts can use via the API -
  # library voices (Rachel and friends) are paid-plan only and fail with a
  # 402. `python run.py voices` lists what your account can actually reach.
  voice_id: SAz9YHcvj6GT2YYXdXww
  model_id: eleven_flash_v2_5     # ElevenLabs' lowest-latency model
  stability: 0.5
  similarity_boost: 0.75
  speed: 1.0

barge_in:
  # Cut playback short when you start talking over it. There is no acoustic
  # echo cancellation here, so on open speakers the risk is that Jarvis hears
  # its own voice and interrupts itself. Headphones remove the problem
  # entirely; on speakers, the ratio below has to be measured rather than
  # guessed - `run.py calibrate` gives you the two numbers it sits between.
  enabled: false
  # Tuned against measurement, not guessed. On this machine Jarvis's own voice
  # reaches the microphone at about 0.014 peak, and a normal speaking voice
  # measures about 0.016 - so the usable gap is narrow, and the 250ms of
  # sustained sound required to trigger is doing as much work as the ratio.
  # On headphones the echo disappears and this can go much lower.
  # Measured on this machine, and the measurement is not encouraging: Jarvis's
  # own voice reaches the microphone at about 0.017 peak, while a normal
  # speaking voice measures about 0.016. The echo is louder than the speaker,
  # so no threshold separates them by level. Two verification runs disagreed -
  # one cut itself off after six seconds, the other ignored a real
  # interruption. On open speakers, expect it to be unreliable in both
  # directions. On headphones the echo vanishes and it works properly, which
  # is the configuration this feature is for.
  ratio: 2.0

wake:
  # Without this, anything above the trigger threshold is treated as speech
  # aimed at Jarvis - including a television in the same room, which it will
  # cheerfully transcribe and answer.
  enabled: true
  # Matched against the transcript, fuzzily: whisper renders the name as
  # "Javis" and "jarvis." often enough that exact matching does not work.
  words: ["jarvis", "hey jarvis", "okay jarvis"]
  # After it answers, keep listening this long without needing the wake word
  # again, so a follow-up question is just a follow-up question.
  stay_awake_s: 45
  # Spoken when woken with nothing else said ("Jarvis?"). Blank for silence.
  acknowledgement: "Yes?"

memory:
  db: jarvis.db
  recent_turns: 20      # turns replayed verbatim into the prompt
  summarize_after: 40   # older turns get folded into a rolling summary past this
  carry_sessions: 3     # how many previous sessions' summaries to carry forward

assistant:
  name: Jarvis
  greeting: "I'm listening."
  # Heard at the end of a turn, these end the session. Jarvis can also end it
  # itself with the end_conversation tool.
  farewells: ["goodbye jarvis", "goodnight jarvis", "bye jarvis", "that's all jarvis"]
